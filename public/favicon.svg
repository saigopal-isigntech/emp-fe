<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="0" y="2" width="64" height="62" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle Container -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="4.5" y="4.5" width="55" height="55" rx="15.5" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />

  <!-- Modern Enterprise Office Building and HR Motif -->
  <rect x="18" y="20" width="28" height="28" rx="4" fill="url(#accentGrad)" />
  
  <!-- Windows Grid -->
  <rect x="22" y="24" width="4" height="4" rx="1" fill="#4f46e5" />
  <rect x="30" y="24" width="4" height="4" rx="1" fill="#4f46e5" />
  <rect x="38" y="24" width="4" height="4" rx="1" fill="#4f46e5" />

  <rect x="22" y="31" width="4" height="4" rx="1" fill="#4f46e5" />
  <rect x="30" y="31" width="4" height="4" rx="1" fill="#4f46e5" />
  <rect x="38" y="31" width="4" height="4" rx="1" fill="#4f46e5" />

  <!-- Portal Entrance -->
  <path d="M28 48V40C28 38.8954 28.8954 38 30 38H34C35.1046 38 36 38.8954 36 40V48H28Z" fill="#312e81" />

